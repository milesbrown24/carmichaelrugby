<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Hawks question form</title></head>
<body>
<!-- Plain HTML lets Netlify detect the form independently of Next.js hydration. -->
<form name="hawks-inquiry" method="POST" action="/thanks/" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="hawks-inquiry">
  <input name="bot-field">
  <input name="name">
  <input type="email" name="email">
  <input name="topic">
  <input name="team">
  <textarea name="message"></textarea>
</form>
</body>
</html>
